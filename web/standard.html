<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>标准HTML页面</title>
</head>
<body>
    <header>
        <h1>我的网站</h1>
        <nav>
            <a href="#home">首页</a>
            <a href="#about">关于</a>
            <a href="#contact">联系</a>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>欢迎访问</h2>
            <p>这是一个标准的 HTML5 页面模板，包含了完整的文档结构和常用元素。</p>
        </section>

        <section id="about">
            <h2>关于我们</h2>
            <p>本页面使用语义化 HTML5 标签构建，遵循现代 Web 开发最佳实践。</p>
            <ul>
                <li>语义化 HTML5 结构（header, main, section, footer）</li>
                <li>响应式视口设置</li>
                <li>现代 CSS 样式与布局</li>
                <li>无障碍友好设计</li>
            </ul>
        </section>

        <section id="contact">
            <h2>联系方式</h2>
            <p>如有任何问题，请通过以下方式联系我们：</p>
            <p>邮箱：<a href="mailto:example@email.com">example@email.com</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 我的网站. 保留所有权利。</p>
    </footer>
</body>
</html>
