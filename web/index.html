<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时交易状态</title>
</head>

<body>
    <header>
        <h1>实时交易状态</h1>
    </header>
    <main>
        <p> <span id="conn-text">连接中...</span> </p>
        <ol id="theList">
            <li style="text-align: center;">暂无数据</li>
        </ol>
    </main>

    <script>
        // 前端自动建立 SSE 连接
        const eventSource = new EventSource('/stream');

        eventSource.onopen = () => { document.getElementById('conn-text').innerText = '实时通道就绪' };
        eventSource.onerror = () => { document.getElementById('conn-text').innerText = '连接中断，重连中...' };

        eventSource.onmessage = (event) => {
            // 💡 前端本地维护容量上限为 100 的滚动 Set
            const localSet = new Set();
            const MAX_LIMIT = 100;
            // 1. 解析后端推过来的 JSON 数据流
            let data;
            try {
                data = JSON.parse(event.data);
            } catch (e) {
                data = event.data;
            }

            // 💡 过滤后端第一发发过来的 { message: 'SSE 连接成功！' } 提示帧
            if (data && data.message === 'SSE 连接成功！') return;

            // 2. 统一转换为数组处理（兼容单条推送和批量数组推送）
            const items = Array.isArray(data) ? data : [data];

            // 3. 逐条压入 Set，超出 100 条自动弹出最老的队头元素
            items.forEach(item => {
                // 如果是对象，转为字符串；如果是纯文本，直接使用
                const lineText = typeof item === 'object' ? JSON.stringify(item) : String(item);

                if (localSet.has(lineText)) { localSet.delete(lineText); }
                localSet.add(lineText);
                if (localSet.size > MAX_LIMIT) {
                    localSet.delete(localSet.keys().next().value);
                }
            });

            // 4. 渲染到 DOM 中（最新数据置顶排在最上方）
            const listEl = document.getElementById('theList');
            // 将 Set 反转，生成 <li> 节点列表
            const listHtml = Array.from(localSet)
                .reverse()
                .map(item => `<li>${item}</li>`)
                .join('');

            listEl.innerHTML = listHtml;
        };
    </script>
</body>

</html>
