<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时交易状态</title>
</head>

<body>
    <!-- <header>
        <h1>实时处理状态</h1>
    </header> -->
    <main>
        <p> <span id="conn-text">连接中...</span> </p>
        <p id="waiting"> 等待接收数据... </p>
        <p id="trade">交易记录</p>
        <ol id="tradeList"></ol>
        <p id="handle">信号处理</p>
        <ol id="handleList"></ol>
    </main>

    <script>
        const MAX_LIMIT = 99; // 前端本地维护容量上限为 99 的滚动 Set
        const dom_tradeList = document.getElementById('tradeList');
        const dom_handleList = document.getElementById('handleList');
        const dom_connText = document.getElementById('conn-text');
        // 前端自动建立 SSE 连接
        let eventSource = null;
        let watchdogTimer = null; // 心跳看门狗定时器

        // 提取公共渲染函数：统一处理节点创建、挂载与裁剪
        function appendLogItem(targetDom, content) {
            const newLine = document.createElement('li');
            newLine.textContent = content; // 优先使用 textContent，性能略高于 innerText
            targetDom.prepend(newLine);
            if (targetDom.children.length > MAX_LIMIT) { targetDom.removeChild(targetDom.lastChild) }
        }

        // 重置/刷新心跳看门狗
        function resetWatchdog() {
            clearTimeout(watchdogTimer);
            // 如果 20 秒内没有收到任何数据（服务端设定的是 10 秒发一次心跳），说明网络已假死
            watchdogTimer = setTimeout(() => {
                console.warn('⚠️ 超过 20 秒未收到服务器任何消息，判定为静默断连，正在强制重连...');
                dom_connText.textContent = '连接超时，正在重连...';

                // 主动关闭旧的 EventSource 实例
                if (eventSource) {
                    eventSource.onopen = null;
                    eventSource.onerror = null;
                    eventSource.onmessage = null;
                    eventSource.close();
                    eventSource = null;
                }
                // 重新建立连接
                connectSSE();
            }, 20000); // 20 秒超时时间
        }

        function connectSSE() {
            if (eventSource) { eventSource.close() } // 先关闭旧的 EventSource 实例
            eventSource = new EventSource('/stream');

            eventSource.onopen = () => {
                dom_connText.textContent = '实时通道就绪';
                resetWatchdog();
            };
            eventSource.onerror = () => { dom_connText.textContent = '连接中断，重连中...' };

            eventSource.onmessage = (event) => {
                resetWatchdog();

                document.getElementById('waiting')?.remove();

                // 解析后端推过来的 JSON 数据流
                let data;
                try {
                    // 安全解析 JSON
                    data = JSON.parse(event.data);
                } catch (e) {
                    // 如果发过来的是心跳包或纯文本，说明不是 JSON，直接忽略或记录
                    return;
                }

                //  拦截服务端的 ping 心跳帧：更新了看门狗之后，直接 return，不向页面渲染！
                if (data && Object.hasOwn(data, 'type') && data.type === 'ping') { 
                    console.log('收到心跳包');
                    return ;
                } else {
                    console.log('收到数据');
                }

                // 过滤后端第一发发过来的 { message: 'SSE' } 提示帧
                // 避免浏览器不刷新导致数据重复，先清空
                if (data && data.message === 'SSE') {
                    dom_tradeList.innerHTML = '';
                    dom_handleList.innerHTML = '';
                    return;
                }

                // 统一转换为数组处理（兼容单条推送和批量数组推送）
                const items = Array.isArray(data) ? data : [data];
                items.forEach(item => {
                    if (!item || typeof item !== 'object') { return }
                    if (Object.hasOwn(item, 'type') && item.type === 'trade') { appendLogItem(dom_tradeList, item.content) }
                    if (Object.hasOwn(item, 'type') && item.type === 'handle') { appendLogItem(dom_handleList, item.content) }
                });

            };
        }

        connectSSE();
    </script>
</body>

</html>
