<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时交易状态</title>
</head>

<body>
    <header>
        <h1>实时处理状态</h1>
    </header>
    <main>
        <p> <span id="conn-text">连接中...</span> </p>
        <p id="waiting"> 等待接收数据... </p>
        <p id="trade">交易记录</p>
        <ol id="tradeList"></ol>
        <p id="handle">信号处理</p>
        <ol id="handleList"></ol>
    </main>

    <script>
        // 前端自动建立 SSE 连接
        const eventSource = new EventSource('/stream');

        eventSource.onopen = () => { document.getElementById('conn-text').innerText = '实时通道就绪' };
        eventSource.onerror = () => { document.getElementById('conn-text').innerText = '连接中断，重连中...' };

        // 💡 前端本地维护容量上限为 100 的滚动 Set
        const MAX_LIMIT = 99;

        eventSource.onmessage = (event) => {
            document.getElementById('waiting')?.remove();            // 💡 前端自动建立 SSE 连接

            // 1. 解析后端推过来的 JSON 数据流
            let data;
            try {
                data = JSON.parse(event.data);
            } catch (e) {
                data = event.data;
            }

            // 💡 过滤后端第一发发过来的 { message: 'SSE 连接成功！' } 提示帧
            if (data && data.message === 'SSE 连接成功！') return;

            // 2. 统一转换为数组处理（兼容单条推送和批量数组推送）
            const items = Array.isArray(data) ? data : [data];

            // 3. 逐条压入 Set，超出 100 条自动弹出最老的队头元素
            items.forEach(item => {
                if (Object.hasOwn(item, 'type') && item.type === 'trade') {
                    const listTrade = document.getElementById('tradeList');
                    const newLine = document.createElement('li');
                    newLine.innerText = item.content;
                    listTrade.prepend(newLine);
                    if (listTrade.children.length > MAX_LIMIT) { listTrade.removeChild(listTrade.lastChild) }
                }
                if (Object.hasOwn(item, 'type') && item.type === 'handle') {
                    const listHandle = document.getElementById('handleList');
                    const newLine = document.createElement('li');
                    newLine.innerText = item.content;
                    listHandle.prepend(newLine);
                    if (listHandle.children.length > MAX_LIMIT) { listHandle.removeChild(listHandle.lastChild) }
                }
            } ) ;

        };
    </script>
</body>

</html>
