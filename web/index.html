<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时交易状态</title>
</head>

<body>
    <!-- <header>
        <h1>实时处理状态</h1>
    </header> -->
    <main>
        <p> <span id="conn-text">连接中...</span> </p>
        <p id="waiting"> 等待接收数据... </p>
        <p id="trade">交易记录</p>
        <ol id="tradeList"></ol>
        <p id="handle">信号处理</p>
        <ol id="handleList"></ol>
        <p id="error">出错记录</p>
        <ol id="errorList"></ol>
    </main>

    <script>
        const MAX_LIMIT = 99; // 前端本地维护容量上限为 99 的滚动 Set
        const dom_tradeList = document.getElementById('tradeList');
        const dom_handleList = document.getElementById('handleList');
        const dom_errorList = document.getElementById('errorList');
        const dom_connText = document.getElementById('conn-text');

        let last_timeID_trade = -1;
        let last_timeID_handle = -1;
        let last_timeID_error = -1;

        let toReNew = true;

        // 提取公共渲染函数：统一处理节点创建、挂载与裁剪
        function appendLogItem(targetDom, content) {
            const newLine = document.createElement('li');
            newLine.textContent = content; // 优先使用 textContent，性能略高于 innerText
            targetDom.prepend(newLine);
            if (targetDom.children.length > MAX_LIMIT) { targetDom.removeChild(targetDom.lastChild) }
        }

        async function getNewData() {
            if (toReNew) {
                last_timeID_trade = -1;
                last_timeID_handle = -1;
                last_timeID_error = -1;
            }

            // 1. 构建 URLSearchParams 动态参数
            const params = new URLSearchParams({ last_timeID_trade, last_timeID_handle, last_timeID_error });
            // 2. 发起请求
            // console.log(`发起请求: ${params.toString()}`);
            const response = await fetch(`/api/get-latest-data?${params.toString()}`);
            if (!response.ok) { 
                dom_connText.textContent = '连接中断，重连中...'; 
                toReNew = true; 
                console.error('请求失败:', response.statusText); 
                return; 
            }
            // console.log(`请求成功: ${response.status}`)
            dom_connText.textContent = '实时通道就绪';
            // 成功接收一次数据后, 删除waiting
            document.getElementById('waiting')?.remove();

            // 3. 解析 JSON 数据
            const data = await response.json();
            const { res_tradeList, res_handleList, res_errorList } = data;

            // 4. 更新 UI
            if (res_tradeList.res_messageLines.length > 0) {
                if (toReNew) { dom_tradeList.innerHTML = '' }
                last_timeID_trade = res_tradeList.res_last_timeID;
                res_tradeList.res_messageLines.forEach(item => { appendLogItem(dom_tradeList, item) });
            }
            if (res_handleList.res_messageLines.length > 0) {
                if (toReNew) { dom_handleList.innerHTML = '' }
                last_timeID_handle = res_handleList.res_last_timeID;
                res_handleList.res_messageLines.forEach(item => { appendLogItem(dom_handleList, item) });
            }
            if (res_errorList.res_messageLines.length > 0) {
                if (toReNew) { dom_errorList.innerHTML = '' }
                last_timeID_error = res_errorList.res_last_timeID;
                res_errorList.res_messageLines.forEach(item => { appendLogItem(dom_errorList, item) });
            }

            if (toReNew) { toReNew = false }
        }

        let loop = null ;
        async function LoopGetNewData(loopTime = 10000) {
            // 1. 如果之前有还在等待中的定时器，先清除（防止重复打断时出现多个定时器）
            if (loop) {
                clearTimeout(loop);
                loop = null;
            }

            // 2. 统一在这里发起请求（无论是第一次启动，还是后续递归调用）
            try {
                await getNewData();
            } catch (error) {
                console.error("数据拉取失败:", error);
            } finally {
                // 3. 无论成功还是失败，等待请求完成后，再过 loopTime 毫秒递归调用下一次
                loop = setTimeout(() => {
                    LoopGetNewData(loopTime);
                }, loopTime);
            }
        }
        
        LoopGetNewData(10000) ;


        // 这样能起到每执行完getNewData后，再过loopTime毫秒再执行getNewData的效果吗?

    </script>
</body>

</html>
